name: Bug report
description: Something does not work — a crash, a wrong output, a broken layout.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove API keys and personal answers before pasting anything.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA (`v1.0.0`, `c7ff4df`…)
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How do you run it?
      options:
        - Release exe (Windows)
        - From source (`py main.py`)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python
      placeholder: Windows 11 23H2 / Python 3.13.3
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Switch UI language to Arabic
        2. Open the model panel
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Traceback (optional)
      description: Copy the relevant part of `startup-error.log`, API keys stripped.
      render: text
