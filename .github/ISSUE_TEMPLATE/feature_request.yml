name: Feature request
description: Suggest a locale, a model provider, a strategy or a workflow improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can be done with the Python standard library only (no new runtime dependency)
          required: true
