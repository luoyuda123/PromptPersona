name: Build EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: 打包 Windows 单文件
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PromptPersona main.py

      - name: 验证产物存在
        run: |
          if (-not (Test-Path "dist/PromptPersona.exe")) { throw "未生成 exe" }
          Get-Item "dist/PromptPersona.exe" | Select-Object Name, Length
        shell: pwsh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PromptPersona-windows
          path: dist/PromptPersona.exe
          if-no-files-found: error
