name: Build EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package Windows single-file exe
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PromptPersona main.py

      - name: Verify artifact and write checksum
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PromptPersona.exe")) { throw "PromptPersona.exe was not produced" }
          $item = Get-Item "dist/PromptPersona.exe"
          $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToUpper()
          "$hash  PromptPersona.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Write-Output "Name: $($item.Name)  Size: $($item.Length)  SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PromptPersona-windows
          path: |
            dist/PromptPersona.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = (Get-Content "dist/SHA256SUMS.txt" -Raw).Trim()
          $notes = "SHA-256 of ``PromptPersona.exe``: ``$hash``" + [Environment]::NewLine + [Environment]::NewLine + "Built by GitHub Actions from $tag."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/PromptPersona.exe" "dist/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tag "dist/PromptPersona.exe" "dist/SHA256SUMS.txt" --title "PromptPersona $tag" --notes $notes
          }
