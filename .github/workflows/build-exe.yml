name: Build EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Package Windows single-file exe
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PromptPersona main.py

      - name: Verify artifact
        run: |
          if (-not (Test-Path "dist/PromptPersona.exe")) { throw "PromptPersona.exe was not produced" }
          Get-Item "dist/PromptPersona.exe" | Select-Object Name, Length
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptPersona-windows
          path: dist/PromptPersona.exe
          if-no-files-found: error
