name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 语法编译检查
        run: python -m compileall -q app main.py tests

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 界面模块可导入（仅 Windows，验证 Tkinter 齐全）
        if: runner.os == 'Windows'
        run: python -c "import app.ui, app.providers, app.storage; print('ui import ok')"
