name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is pinned to 22.04: setup-python has no 3.9 build for the newer images.
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile check
        run: python -m compileall -q app main.py tests

      - name: Lint (ruff)
        run: |
          python -m pip install --quiet ruff
          ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Import UI modules (Windows only, verifies Tkinter)
        if: runner.os == 'Windows'
        run: python -c "import app.ui, app.providers, app.storage; print('ui import ok')"
